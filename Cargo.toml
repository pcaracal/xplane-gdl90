[package]
name = "xplane-gdl90"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
# lto = true # +10s compile time
incremental = true
codegen-units = 1
strip = "symbols"

[lib]
crate-type = ["cdylib"]

[dependencies]
gdl90 = { git = "https://github.com/pcaracal/gdl90.git" }
xplm-egui = { git = "https://github.com/pcaracal/xplm-egui.git" }
egui_extras = "0.34.1"
egui = "0.34.1"
uom = { version = "0.38.0", features = ["autoconvert"] }
num = "0.4.3"
anyhow = "1.0.102"
utilities_derive = { git = "https://github.com/pcaracal/utilities_derive.git", version = "0.1.0" }
humantime = "2.3.0"
simplelog = "0.12.2"
log = "0.4.29"
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
pastey = "0.2.2"
bitflags = "2.11.1"
serde_json = "1.0.149"
